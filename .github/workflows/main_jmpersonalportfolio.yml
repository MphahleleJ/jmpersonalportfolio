
name: Build and deploy Next.js app to Azure Web App - jmpersonalportfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show source commit
        run: |
          echo "Building commit: $GITHUB_SHA"
          git log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Add deployment fingerprint
        run: |
          echo "$GITHUB_SHA" > .next/standalone/BUILD_COMMIT

          echo "Build fingerprint:"
          cat .next/standalone/BUILD_COMMIT

      - name: Verify standalone package
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/standalone/.next/static
          test -d .next/standalone/node_modules

          echo "Build ID:"
          cat .next/BUILD_ID

          echo "Standalone files:"
          ls -lah .next/standalone

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deployment

      - name: Verify deployment artifact
        run: |
          echo "Deployment commit:"
          cat ./deployment/BUILD_COMMIT

          test -f ./deployment/server.js
          test -f ./deployment/package.json
          test -d ./deployment/.next/static
          test -d ./deployment/node_modules

          echo "Artifact verification successful"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1BF697ABDFFB44BF83ED6EB87B2BD2FF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7C2A1261713B47A096E2E8C49A87FCC3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D13E4ACD5BCB419AAAFEDC3826E6CF90 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: jmpersonalportfolio
          slot-name: Production
          package: ./deployment
          clean: true
          restart: true

      - name: Deployment completed
        run: |
          echo "Deployment completed successfully"
          echo "Application: jmpersonalportfolio"
          echo "Commit: $GITHUB_SHA"