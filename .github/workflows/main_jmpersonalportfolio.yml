
name: Build and deploy Next.js to Azure Web App - jmpersonalportfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Verify standalone deployment
        run: |
          echo "Checking standalone deployment..."

          test -f .next/standalone/server.js

          test -d .next/standalone/.next/static

          echo "Standalone server found"
          echo "Static assets found"

          ls -la .next/standalone

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone
          path: .next/standalone/
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-standalone
          path: ./deploy

      - name: Verify deployment package
        run: |
          echo "Deployment package contents:"
          ls -la ./deploy

          test -f ./deploy/server.js

          echo "Deployment package is ready"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1BF697ABDFFB44BF83ED6EB87B2BD2FF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7C2A1261713B47A096E2E8C49A87FCC3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D13E4ACD5BCB419AAAFEDC3826E6CF90 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: jmpersonalportfolio
          slot-name: Production
          package: ./deploy
